services:
  postgres:
    image: postgres:17
    container_name: bankapp-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - ./.docker/postgres:/var/lib/postgresql/data
